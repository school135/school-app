<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Школа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        .login-box h2 { color: #1a365d; margin-bottom: 25px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #1a365d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        .error { color: #e53e3e; margin-bottom: 15px; font-size: 14px; }
        .back-link { margin-top: 15px; font-size: 13px; }
        .back-link a { color: #1a365d; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Вход для школы</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <div class="back-link">
            <a href="/">← Вернуться к записи</a>
        </div>
    </div>
</body>
</html>
